[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veritasnet"
version = "0.1.0"
description = "Verifiable Decentralized AI Training & PoTW Consensus Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veritasnet"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
